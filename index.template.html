<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Nine Lives</title>
  <meta name="description" content="Nine study rooms in nine cities, each with a live local clock.">
  <style>
    :root {
      --bg: #07060c;
      --bg-2: #0e0c16;
      --ink: #f3eefc;
      --muted: #9a92ad;
      --line: rgba(160, 140, 255, 0.22);
      --cyan: #5dffe9;
      --cyan-dim: #1ad4c0;
      --magenta: #ff4fd8;
      --amber: #ffc857;
      --rain: rgba(90, 160, 255, 0.55);
      --tile-radius: 14px;
      --header-h: 72px;
      --footer-h: 36px;
      --gap: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(80, 20, 90, 0.35), transparent 55%),
        radial-gradient(900px 500px at 100% 100%, rgba(0, 60, 70, 0.28), transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans", "Apple SD Gothic Neo", sans-serif;
      letter-spacing: 0.01em;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .chrome {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: var(--header-h);
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18, 14, 28, 0.92), rgba(10, 8, 16, 0.75));
      backdrop-filter: blur(10px);
      z-index: 5;
    }
    .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .title-main {
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.15;
      background: linear-gradient(90deg, var(--cyan), #d8b6ff 45%, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 10px rgba(93, 255, 233, 0.25));
    }
    .title-sub {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .theme-wrap { position: relative; }
    .theme-btn, .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(20, 16, 32, 0.8);
      color: var(--ink);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .theme-btn:hover, .sound-btn:hover,
    .theme-btn[aria-expanded="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
    }
    .theme-btn .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .theme-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(280px, 70vw);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.96);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 79, 216, 0.08);
      z-index: 20;
    }
    .theme-menu.open { display: block; }
    .theme-item {
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border-radius: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .theme-item:hover:not(:disabled) { background: rgba(93, 255, 233, 0.08); }
    .theme-item[aria-current="true"] { background: rgba(93, 255, 233, 0.12); }
    .theme-item:disabled { opacity: 0.55; cursor: not-allowed; }
    .theme-item .ko { color: var(--muted); font-size: 0.78rem; }
    .theme-item .soon {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .sound-btn[aria-pressed="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
    }
    .sound-btn svg, .theme-btn .chev { flex: 0 0 auto; }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: var(--gap);
      display: flex;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gap);
      min-height: 0;
    }

    .tile {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: var(--tile-radius);
      border: 1px solid rgba(180, 160, 255, 0.18);
      background: #120e18;
      cursor: pointer;
      text-align: left;
      color: inherit;
      min-height: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .tile:hover, .tile:focus-visible {
      border-color: rgba(93, 255, 233, 0.65);
      box-shadow: 0 0 0 1px rgba(93, 255, 233, 0.25), 0 0 28px rgba(93, 255, 233, 0.18);
      outline: none;
    }
    .tile .vis, .tile video, .tile img.still {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .tile video { opacity: 0; transition: opacity 0.45s ease; }
    .tile video.on { opacity: 1; }
    .tile img.still { opacity: 1; transition: opacity 0.45s ease; }
    .tile .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(6, 4, 12, 0.15) 0%, transparent 28%, transparent 52%, rgba(6, 4, 12, 0.82) 100%),
        linear-gradient(90deg, rgba(10, 20, 50, 0.12), transparent 30%);
      pointer-events: none;
      z-index: 1;
    }
    .rain-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
      opacity: 0.9;
    }
    .rain-layer span {
      position: absolute;
      top: -20%;
      width: 1.2px;
      height: 14%;
      background: linear-gradient(180deg, transparent, var(--rain), transparent);
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {
      from { transform: translateY(0); }
      to { transform: translateY(900%); }
    }
    .wet-glass {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(200, 230, 255, 0.07), transparent 18%),
        radial-gradient(circle at 70% 20%, rgba(200, 230, 255, 0.06), transparent 14%),
        linear-gradient(180deg, rgba(140, 180, 255, 0.05), transparent 40%);
      mix-blend-mode: screen;
    }
    .meta {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: 12px 12px 11px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .activity {
      font-size: clamp(0.92rem, 1.55vw, 1.18rem);
      font-weight: 560;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: #fff8ff;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.92), 0 0 18px rgba(93, 255, 233, 0.16);
      min-height: 1.3em;
      transition: opacity 0.4s ease;
    }
    .activity.is-fading { opacity: 0; }
    .meta-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }
    .who { min-width: 0; }
    .city {
      font-size: 0.66rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d8d2e8;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    }
    .who .name {
      display: block;
      margin-top: 1px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .neon {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
      font-size: clamp(0.82rem, 1.15vw, 1.08rem);
      letter-spacing: 0.06em;
      color: var(--cyan);
      text-shadow:
        0 0 4px rgba(93, 255, 233, 0.9),
        0 0 14px rgba(36, 230, 200, 0.7),
        0 0 28px rgba(36, 230, 200, 0.35);
      line-height: 1;
      white-space: nowrap;
    }
    .clock-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      min-width: 0;
    }
    .wx {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      font-size: 0.58rem;
      letter-spacing: 0.03em;
      color: #c8c2d6;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      opacity: 0.85;
    }
    .wx.is-on { display: flex; }
    .wx[hidden] { display: none !important; }
    .wx-icon {
      width: 11px; height: 11px;
      flex: 0 0 auto;
      display: block;
      opacity: 0.85;
    }
    .wx-temp {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .wx-label { display: none; }
    .focus-panel .activity {
      margin-top: 8px;
      font-size: 1.15rem;
    }
    .focus-panel .wx { margin-top: 6px; font-size: 0.72rem; opacity: 0.8; }
    .focus-panel .wx-icon { width: 13px; height: 13px; }
    .focus-panel .wx-label { display: none; }
    .weather-credit {
      opacity: 0.78;
      white-space: nowrap;
    }
    footer p { text-align: center; padding: 0 10px; }

    .neon .ampm {
      margin-left: 0.28em;
      font-size: 0.48em;
      letter-spacing: 0.14em;
      color: var(--magenta);
      text-shadow:
        0 0 4px rgba(255, 79, 216, 0.95),
        0 0 12px rgba(255, 79, 216, 0.55);
      vertical-align: 0.35em;
    }
    .tile[data-period="evening"] .neon { color: var(--amber); text-shadow: 0 0 4px rgba(255, 200, 87, 0.9), 0 0 16px rgba(255, 180, 60, 0.55); }
    .tile[data-period="evening"] .neon .ampm { color: #ff8a4c; text-shadow: 0 0 6px rgba(255, 120, 60, 0.8); }
    .tile[data-period="late"] .neon,
    .tile[data-period="night"] .neon { color: #8ad4ff; text-shadow: 0 0 4px rgba(100, 190, 255, 0.9), 0 0 16px rgba(40, 120, 255, 0.5); }

    footer {
      flex: 0 0 var(--footer-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      border-top: 1px solid var(--line);
    }
    footer a { color: #c8c0dc; }
    footer a:hover { color: var(--cyan); }

    /* Focused room */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 3, 8, 0.72);
      backdrop-filter: blur(8px);
    }
    .overlay.open { display: flex; }
    .focus-card {
      position: relative;
      width: min(1040px, 100%);
      height: min(680px, 100%);
      display: grid;
      grid-template-rows: 1fr auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(93, 255, 233, 0.35);
      box-shadow: 0 0 0 1px rgba(255, 79, 216, 0.12), 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 60px rgba(93, 255, 233, 0.1);
      background: #0a0810;
    }
    .focus-vis { position: relative; min-height: 0; background: #120e18; }
    .focus-vis video, .focus-vis img, .focus-vis .shade, .focus-vis .rain-layer, .focus-vis .wet-glass {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .focus-vis video, .focus-vis img { object-fit: cover; object-position: center 40%; }
    .focus-vis video { opacity: 0; transition: opacity 0.45s ease; }
    .focus-vis video.on { opacity: 1; }
    .focus-panel {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      padding: 16px 20px 18px;
      background: linear-gradient(180deg, #100c18, #0a0812);
      border-top: 1px solid var(--line);
    }
    .focus-panel .city-lg {
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .focus-panel .sub { margin-top: 4px; color: var(--muted); font-size: 0.88rem; }
    .focus-panel .mood { margin-top: 8px; color: #d8e7ff; font-size: 0.92rem; max-width: 46ch; }
    .focus-panel .neon { font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      z-index: 5;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(8, 6, 14, 0.7);
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
    }
    .close-btn:hover { border-color: var(--cyan); color: var(--cyan); }

    .focus-vis .vis { position: absolute; inset: 0; }

    @media (max-width: 720px) {
      .theme-btn .label-extra { display: none !important; }
      #soundLabel, #musicLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .title-main { font-size: 1.05rem; }
    }

    @media (max-width: 720px) and (orientation: portrait) {
      :root { --header-h: 58px; --footer-h: 40px; --gap: 8px; }
      html, body { height: auto; }
      body { overflow: auto; }
      .chrome {
        position: sticky;
        top: 0;
        padding: 0 12px;
      }
      .title-sub { font-size: 0.6rem; }
      main { display: block; height: auto; flex: 0 0 auto; min-height: auto; }
      footer { position: relative; flex: 0 0 auto; }
      .grid {
        display: flex;
        flex-direction: column;
        height: auto;
        gap: 8px;
      }
      .tile {
        flex: 0 0 auto;
        height: 52vw;
        min-height: 200px;
        max-height: 280px;
      }
      .neon { font-size: 1.35rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      :root { --header-h: 42px; --footer-h: 22px; --gap: 5px; --tile-radius: 8px; }
      .chrome { padding: 0 10px; }
      .title-main { font-size: 0.95rem; letter-spacing: 0.06em; }
      .title-sub { display: none; }
      .theme-btn, .sound-btn { padding: 4px 9px; font-size: 0.72rem; }
      .theme-btn .label-extra { display: none; }
      .meta { padding: 6px 8px 7px; }
      .city { font-size: 0.62rem; letter-spacing: 0.08em; }
      .who .name { display: none; }
      .neon { font-size: 0.8rem; }
      .activity { font-size: 0.78rem; }
      .wx-label { display: none; }
      .focus-card { height: 100%; }
      .focus-panel { padding: 8px 12px; }
      .focus-panel .mood { display: none; }
      footer { font-size: 0.62rem; }
    }


    /* Hamburger + settings (language row at the bottom; theme toggles can be added above it later) */
    .menu-btn {
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.94);
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .menu-btn:hover, .menu-btn:focus-visible, .menu-btn[aria-expanded="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
      outline: none;
      color: var(--cyan);
    }
    .settings-panel {
      display: none;
      position: fixed;
      left: 60px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 31;
      width: min(280px, calc(100vw - 76px));
      padding: 12px 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.96);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 79, 216, 0.08);
    }
    .settings-panel.open { display: block; }
    .settings-panel h2 {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 0 8px 10px;
    }
    .settings-slot { min-height: 0; }
    .settings-lang {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 8px;
      border-top: 1px solid var(--line);
    }
    .settings-lang span.label { font-size: 0.92rem; }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }
    .switch .track {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #2a2436;
      border: 1px solid var(--line);
      transition: background 0.2s, border-color 0.2s;
    }
    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d8d0e8;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .track {
      background: rgba(93, 255, 233, 0.22);
      border-color: rgba(93, 255, 233, 0.7);
    }
    .switch input:checked + .track::after {
      transform: translateX(18px);
      background: var(--cyan);
    }
    .switch input:focus-visible + .track {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--cyan);
    }
    @media (min-width: 721px) {
      main { padding-left: 56px; }
    }
    @media (max-width: 720px) and (orientation: portrait) {
      main { padding-left: 8px; }
      .menu-btn {
        top: auto;
        bottom: 16px;
        left: 12px;
        transform: none;
      }
      .settings-panel {
        top: auto;
        bottom: 68px;
        left: 12px;
        transform: none;
      }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .menu-btn { width: 32px; height: 32px; font-size: 1rem; left: 6px; }
      .settings-panel { left: 44px; }
      main { padding-left: 44px; }
    }


    .tile { transition: opacity 0.45s ease; }
    .tile.visitor-fade { opacity: 0.4; }
    .who .tag {
      display: none;
      margin-top: 2px;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(93, 255, 233, 0.45);
    }
    .tile.is-visitor .who .tag { display: block; }
    .tile.is-visitor .name { letter-spacing: 0.14em; }
    @media (max-height: 500px) and (orientation: landscape) {
      .who .tag { font-size: 0.5rem; letter-spacing: 0.08em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rain-layer span, .tile video, .tile img.still, .focus-vis video { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <header class="chrome">
    <div class="brand">
      <div class="title-main">Nine Lives</div>
      <div class="title-sub">나인 라이브스</div>
    </div>
    <div class="controls">
      <div class="theme-wrap">
        <button type="button" class="theme-btn" id="themeBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu">
          <span class="dot" aria-hidden="true"></span>
          <span id="themeLabel">Rainy Window</span>
          <span class="label-extra" style="color:var(--muted);font-size:0.78em">비 오는 창가</span>
          <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path fill="currentColor" d="M2 3.5 5 7l3-3.5H2z"/></svg>
        </button>
        <div class="theme-menu" id="themeMenu" role="listbox" aria-label="Themes"></div>
      </div>
      <button type="button" class="sound-btn" id="musicBtn" aria-pressed="false" title="Music">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span id="musicLabel">Music</span>
      </button>
      <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true" title="Ambience">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v3M7 5l1.5 2.5M17 5l-1.5 2.5M5 14a7 7 0 0 0 14 0M8 13c0 2 1.5 4 4 5.5C14.5 17 16 15 16 13"/>
        </svg>
        <span id="soundLabel">Ambience</span>
      </button>

      const m = String(tag || '').match(/-([A-Za-z]{2})(?:$|-)/);
      return m ? m[1].toUpperCase() : '';
    }
    function formatLocale() {
      const region = localeRegion(navLocale());
      if (readForceEnglish() || currentLang === 'en') {
        return region ? 'en-' + region : (t().dateLocale || 'en');
      }
      return t().dateLocale || currentLang;
    }
    function visitorHourCycle() {
      const loc = navLocale() || formatLocale();
      try {
        const c = new Intl.DateTimeFormat(loc, { hour: 'numeric' }).resolvedOptions().hourCycle;
        if (c) return c;
      } catch (e) {}
      return 'h23';
    }

    function lookupIpCity() {
      if (typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
      function pick(data, city, lat, lon, country, timezone) {
        const name = city && String(city).trim();
        if (!name) throw new Error('no city');
        return {
          city: name,
          lat: Number(lat),
          lon: Number(lon),
          country: String(country || '').toUpperCase(),
          timezone: timezone || ''
        };
      }
      return fetchJsonTimeout('https://ipapi.co/json/', 3000)
        .then(function (data) {
          return pick(data, data && data.city, data && data.latitude, data && data.longitude, data && (data.country_code || data.country), data && data.timezone);
        })
        .catch(function () {
          return fetchJsonTimeout('https://ipwho.is/', 3000).then(function (data) {
            const tz = data && data.timezone && (data.timezone.id || data.timezone);
            return pick(data, data && data.success !== false && data.city, data && data.latitude, data && data.longitude, data && data.country_code, tz);
          });
        });
    }

    // Clock times: YOU uses the browser zone only (IP timezone is ignored).
    // Outer cells, including swapped backups, use that city's IANA zone (DST-correct).
    // Display format follows the visitor's locale hour cycle (12h AM/PM for en-US,
    // 24h elsewhere per Intl). English-force uses en + the visitor region's hour cycle.
    function cityParts(tz, date) {
      const loc = formatLocale();
      const cycle = visitorHourCycle();
      const use12h = cycle === 'h11' || cycle === 'h12';
      const opts = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: cycle,
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      };
      if (tz) opts.timeZone = tz;
      let parts;
      try {
        parts = new Intl.DateTimeFormat(loc, opts).formatToParts(date);
      } catch (e) {
        delete opts.timeZone;
        parts = new Intl.DateTimeFormat(loc, opts).formatToParts(date);
      }
      const get = (type) => (parts.find((p) => p.type === type) || {}).value || '';
      const hour24Opts = { hour: 'numeric', hourCycle: 'h23' };
      if (tz) hour24Opts.timeZone = tz;
      let hour24 = 0;
      try {
        hour24 = Number((new Intl.DateTimeFormat('en-US', hour24Opts).formatToParts(date).find(function (part) { return part.type === 'hour'; }) || {}).value);
      } catch (e) {
        hour24 = Number(get('hour'));
      }
      const hour12 = hour24 % 12 || 12;
      const minute = get('minute');
      const second = get('second');
      const ampm = hour24 >= 12 ? 'PM' : 'AM';
      return {
        hour24, hour12, minute, second, ampm, use12h,
        weekday: get('weekday'),
        month: get('month'),
        day: get('day'),
        year: get('year')
      };
    }

    // Local-time variant rules (documented in README.md):
    //   07:00–16:59  day      looping idle clip (desk / studying); still fallback: desk
    //   17:00–21:59  evening  dark still (lamp-lit, quieter room)
    //   22:00–23:59  late     off still (lights off)
    //   00:00–06:59  night    bed still (asleep)
    function periodForHour(h) {
      if (h >= 7 && h < 17) return 'day';
      if (h >= 17 && h < 22) return 'evening';
      if (h >= 22) return 'late';
      return 'night';
    }

    const MOODS = {
      rainy: {
        day: 'Rain taps the window. A calm day to stay in and study.',
        evening: 'Evening rain. The lamp keeps the desk warm.',
        late: 'Rain in the dark. The lights are off.',
        night: 'Rain through the night. The room is asleep.'
      }
    };

    function neonHTML(p) {
      if (p.use12h) {
        return String(p.hour12) + ':' + p.minute + '<span class="ampm">' + p.ampm + '</span>';
      }
      const h = String(p.hour24).padStart(2, '0');
      return h + ':' + p.minute;
    }

    function rainDrops(count) {
      const layer = document.createElement('div');
      layer.className = 'rain-layer';
      layer.setAttribute('aria-hidden', 'true');
      if (reduceMotion) return layer;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.animationDuration = (0.7 + Math.random() * 0.9).toFixed(2) + 's';
        s.style.animationDelay = (-Math.random() * 2).toFixed(2) + 's';
        s.style.height = (10 + Math.random() * 16).toFixed(1) + '%';
        s.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
        layer.appendChild(s);
      }
      const wet = document.createElement('div');
      wet.className = 'wet-glass';
      wet.setAttribute('aria-hidden', 'true');
      const wrap = document.createDocumentFragment();
      wrap.appendChild(layer);
      wrap.appendChild(wet);
      return wrap;
    }

    const grid = document.getElementById('grid');
    const tiles = [];

    function makeVisual(room, dropCount) {
      const wrap = document.createElement('div');
      wrap.className = 'vis';
      const img = document.createElement('img');
      img.className = 'still';
      img.alt = '';
      img.draggable = false;
      const vid = document.createElement('video');
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      vid.preload = 'metadata';
      vid.setAttribute('playsinline', '');
      vid.setAttribute('muted', '');
      vid.poster = asset(room.id + '_desk.jpg');
      vid.src = asset(room.id + '_idle.mp4');
      const shade = document.createElement('div');
      shade.className = 'shade';
      wrap.appendChild(img);
      wrap.appendChild(vid);
      wrap.appendChild(shade);
      wrap.appendChild(rainDrops(dropCount));
      return { wrap, img, vid };
    }

    let currentLayout = layoutFromZone();

    function displayCity(room) {
      if (room.cityIsFallback) return t().yourCity;
      if (room.cityKey && CITY_NAMES[room.cityKey]) return locName(room.cityKey);
      return room.city;
    }
    const ACTIVITY_BLOCKS = [
      { id: 'night', start: 0, end: 5 },
      { id: 'predawn', start: 5, end: 7 },
      { id: 'morning', start: 7, end: 9 },
      { id: 'studyam', start: 9, end: 12 },
      { id: 'midday', start: 12, end: 14 },
      { id: 'studypm', start: 14, end: 17 },
      { id: 'dusk', start: 17, end: 19 },
      { id: 'evening', start: 19, end: 21 },
      { id: 'latenight', start: 21, end: 23 },
      { id: 'owl', start: 23, end: 24 }
    ];
    const WX_ACTIVITY_BLOCKS = { studyam: 1, midday: 1, studypm: 1, dusk: 1, evening: 1, latenight: 1, owl: 1 };
    function hourOverride() {
      try {
        const raw = new URLSearchParams(window.location.search).get('hour');
        if (raw == null || raw === '') return null;
        const n = Number(raw);
        if (Number.isInteger(n) && n >= 0 && n <= 23) return n;
      } catch (e) {}
      return null;
    }
    function virtualNow() {
      const raw = new Date();
      const ov = hourOverride();
      if (ov == null) return raw;
      const opts = { hour: 'numeric', hourCycle: 'h23' };
      const z = browserZone();
      if (z) opts.timeZone = z;
      let curH = raw.getHours();
      try {
        curH = Number((new Intl.DateTimeFormat('en-US', opts).formatToParts(raw).find(function (part) { return part.type === 'hour'; }) || {}).value);
      } catch (e) {}
      return new Date(raw.getTime() + (ov - curH) * 3600000);
    }
    function activityBlockId(hour) {
      const h = ((Number(hour) % 24) + 24) % 24;
      for (let i = 0; i < ACTIVITY_BLOCKS.length; i++) {
        const b = ACTIVITY_BLOCKS[i];
        if (h >= b.start && h < b.end) return b.id;
      }
      return 'night';
    }
    function activityLineFor(room, hour24, wx) {
      const pack = (t().activity || I18N.en.activity || {});
      const block = activityBlockId(hour24);
      if (room && room.visitor) {
        const kind = wx ? weatherKind(wx.code) : '';
        if (WX_ACTIVITY_BLOCKS[block] && pack.youWx && pack.youWx[kind]) return pack.youWx[kind];
        return (pack.you && pack.you[block]) || '';
      }
      const who = (room && room.name) || '';
      const kind = wx ? weatherKind(wx.code) : '';
      if (WX_ACTIVITY_BLOCKS[block] && pack.wx && pack.wx[kind]) return pack.wx[kind];
      const row = pack[who] || pack.Mia || {};
      return row[block] || '';
    }
    function setActivityText(el, text) {
      if (!el) return;
      if (el.dataset.line === text) return;
      const apply = function () {
        el.textContent = text;
        el.dataset.line = text;
        el.classList.remove('is-fading');
      };
      if (reduceMotion || !el.dataset.line) { apply(); return; }
      el.classList.add('is-fading');
      setTimeout(apply, 220);
    }
    function labelTile(tile) {
      const room = tile.room;
      const s = t();
      const city = displayCity(room);
      room.city = city;
      tile.el.querySelector('.city').textContent = city;
      tile.el.querySelector('.name').textContent = room.name;
      const tag = tile.el.querySelector('.tag');
      if (tag) tag.textContent = room.visitor ? s.yourTime : '';
      const act = tile.activity ? (tile.activity.dataset.line || tile.activity.textContent || '') : '';
      const aria = s.inCity.replace('{name}', room.name).replace('{city}', city);
      tile.el.setAttribute('aria-label', act ? aria + '. ' + act : aria);
      tile.el.classList.toggle('is-visitor', !!room.visitor);
    }

    function bindTile(tile, room) {
      const artChanged = !tile.room || tile.room.id !== room.id;
      tile.room = room;
      tile.el.dataset.room = room.id;
      if (artChanged) {
        tile.vid.pause();
        tile.vid.poster = asset(room.id + '_desk.jpg');
        tile.vid.src = asset(room.id + '_idle.mp4');
        tile.el.dataset.period = '';
      }
      labelTile(tile);
    }

    function applyLayout(slots, animate) {
      const same = layoutsEqual(currentLayout, slots);
      currentLayout = slots;
      const run = function () {
        tiles.forEach(function (tile, i) {
          bindTile(tile, slots[i]);
          tile.el.classList.remove('visitor-fade');
        });
        if (focused && focused.visitor) {
          const you = slots[CENTER_SLOT];
          focused = you;
          if (focusTile) focusTile.room = you;
        }
        tick();
        refreshWeather();
      };
      if (!animate || same || reduceMotion) { run(); return; }
      tiles.forEach(function (tile) { tile.el.classList.add('visitor-fade'); });
      setTimeout(run, 280);
    }

    currentLayout.forEach(function (room) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile';
      const vis = makeVisual(room, 14);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML =
        '<div class="activity" aria-live="polite"></div>' +
        '<div class="meta-row"><div class="who"><div class="city"></div><span class="name"></span><span class="tag"></span></div>' +
        '<div class="clock-col"><div class="neon" aria-live="off"></div><div class="wx" hidden></div></div></div>';
      btn.appendChild(vis.wrap);
      btn.appendChild(meta);
      const tile = { room: room, el: btn, img: vis.img, vid: vis.vid, clock: meta.querySelector('.neon'), wx: meta.querySelector('.wx'), activity: meta.querySelector('.activity') };
      btn.addEventListener('click', function () { openFocus(tile.room); });
      grid.appendChild(btn);
      tiles.push(tile);
      bindTile(tile, room);
    });

    function applyVariant(tile, period) {
      const id = tile.room.id;
      const stills = { day: 'desk', evening: 'dark', late: 'off', night: 'bed' };
      tile.img.src = asset(id + '_' + stills[period] + '.jpg');
      tile.el.dataset.period = period;
      const useVideo = period === 'day' && !reduceMotion;
      if (useVideo) {
        tile.vid.classList.add('on');
        const play = tile.vid.play();
        if (play && play.catch) play.catch(function () {});
      } else {
        tile.vid.classList.remove('on');
        tile.vid.pause();
      }
    }

    function tick() {
      const now = virtualNow();
      tiles.forEach((tile) => {
        const p = cityParts(roomZone(tile.room), now);
        const period = periodForHour(p.hour24);
        tile.clock.innerHTML = neonHTML(p);
        if (tile.el.dataset.period !== period) applyVariant(tile, period);
        const line = activityLineFor(tile.room, p.hour24, weatherForRoom(tile.room));
        setActivityText(tile.activity, line);
        const s = t();
        const city = displayCity(tile.room);
        const aria = s.inCity.replace('{name}', tile.room.name).replace('{city}', city);
        tile.el.setAttribute('aria-label', line ? aria + '. ' + line : aria);
      });
      if (focused) updateFocus(now);
    }

    let focused = null;
    const overlay = document.getElementById('overlay');
    const focusVis = document.getElementById('focusVis');
    const focusClock = document.getElementById('focusClock');
    let focusTile = null;

    function openFocus(room) {
      focused = room;
      overlay.hidden = false;
      overlay.classList.add('open');
      focusVis.innerHTML = '';
      const vis = makeVisual(room, 28);
      focusVis.appendChild(vis.wrap);
      focusTile = { room, el: focusVis, img: vis.img, vid: vis.vid };
      document.getElementById('focusCity').textContent = room.city;
      updateFocus(virtualNow());
      document.getElementById('closeBtn').focus();
    }

    function updateFocus(now) {
      if (!focused || !focusTile) return;
      const p = cityParts(roomZone(focused), now);
      const period = periodForHour(p.hour24);
      applyVariant(focusTile, period);
      focusClock.innerHTML = neonHTML(p);
      document.getElementById('focusCity').textContent = focused.city;
      const dateStr = p.weekday + ', ' + p.month + ' ' + p.day + ', ' + p.year;
      const zone = (roomZone(focused) || '').replace(/_/g, ' ');
      const bits = [focused.name];
      if (focused.visitor) bits.push(t().yourTime);
      else if (focused.region) bits.push(focused.region);
      bits.push(dateStr);
      if (zone) bits.push(zone);
      document.getElementById('focusSub').textContent = bits.join(' · ');
      const pack = t();
      const moods = (pack.moods && pack.moods[currentTheme]) || pack.moods.rainy || (MOODS.rainy);
      document.getElementById('focusMood').textContent = moods[period];
      const focusWx = document.getElementById('focusWx');
      if (focusWx) paintWxEl(focusWx, weatherForRoom(focused));
      const focusAct = document.getElementById('focusActivity');
      if (focusAct) setActivityText(focusAct, activityLineFor(focused, p.hour24, weatherForRoom(focused)));
    }

    function closeFocus() {
      overlay.classList.remove('open');
      overlay.hidden = true;
      if (focusTile && focusTile.vid) focusTile.vid.pause();
      focusTile = null;
      focused = null;
    }

    document.getElementById('closeBtn').addEventListener('click', closeFocus);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeFocus(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (overlay.classList.contains('open')) closeFocus();
        else if (settingsPanel && !settingsPanel.hidden) closeSettings(true);
        else closeThemeMenu();
        return;
      }
      if (e.key === 'Tab' && settingsPanel && !settingsPanel.hidden) {
        const nodes = [menuBtn, document.getElementById('englishToggle')];
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });

    // Theme menu (data-driven; coming-soon themes stay listed but disabled)
    const themeMenu = document.getElementById('themeMenu');
    const themeBtn = document.getElementById('themeBtn');
    function renderThemeMenu() {
      themeMenu.innerHTML = '';
      THEMES.forEach((themeItem) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'theme-item';
        b.setAttribute('role', 'option');
        b.dataset.id = themeItem.id;
        if (themeItem.status !== 'ready') b.disabled = true;
        if (themeItem.id === currentTheme) b.setAttribute('aria-current', 'true');
        const names = themeNames(themeItem.id);
        b.innerHTML = '<span>' + names.main + ' <span class="ko">' + names.extra + '</span></span>' +
          (themeItem.status === 'coming' ? '<span class="soon">' + t().comingSoon + '</span>' : '');
        b.addEventListener('click', () => {
          if (themeItem.status !== 'ready') return;
          currentTheme = themeItem.id;
          const n = themeNames(themeItem.id);
          document.getElementById('themeLabel').textContent = n.main;
          const extra = document.querySelector('.theme-btn .label-extra');
          if (extra) extra.textContent = n.extra;
          renderThemeMenu();
          closeThemeMenu();
          tick();
        });
        themeMenu.appendChild(b);
      });
    }
    function closeThemeMenu() {
      themeMenu.classList.remove('open');
      themeBtn.setAttribute('aria-expanded', 'false');
    }
    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = themeMenu.classList.toggle('open');
      themeBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!themeBtn.parentElement.contains(e.target)) closeThemeMenu();
      if (settingsPanel && !settingsPanel.hidden &&
          !settingsPanel.contains(e.target) && !menuBtn.contains(e.target)) {
        closeSettings(false);
      }
    });
    renderThemeMenu();

    // Live weather (Open-Meteo). Hidden until a successful fetch; last values kept on failure.
    const WX_REFRESH_MS = 15 * 60 * 1000;
    const WX_TIMEOUT_MS = 4000;
    const AMBIENCE_MUTE_KEY = 'ninelives.ambienceMuted';
    let visitorGeo = null;
    let visitorCountry = '';
    let weatherByKey = {};
    let weatherTimer = null;
    let youWeather = null;

    function weatherQueryOff() {
      try { return new URLSearchParams(window.location.search).get('weather') === 'off'; }
      catch (e) { return false; }
    }
    function useFahrenheit() {
      if (visitorCountry === 'US') return true;
      const loc = (navLocale() || '').toLowerCase();
      return loc === 'en-us' || loc.indexOf('en-us-') === 0;
    }
    function weatherKind(code) {
      const c = Number(code);
      if (c === 0 || c === 1) return 'clear';
      if (c === 2 || c === 3) return 'cloudy';
      if (c === 45 || c === 48) return 'fog';
      if (c >= 51 && c <= 57) return 'drizzle';
      if (c === 71 || c === 73 || c === 75 || c === 77 || c === 85 || c === 86) return 'snow';
      if (c === 95 || c === 96 || c === 99) return 'thunder';
      if (c === 65 || c === 67 || c === 81 || c === 82) return 'thunder';
      if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
      return 'cloudy';
    }
    function coordKey(lat, lon) {
      return Number(lat).toFixed(2) + ',' + Number(lon).toFixed(2);
    }
    function coordsForRoom(room) {
      if (!room) return null;
      if (room.visitor) {
        if (visitorGeo && isFinite(visitorGeo.lat) && isFinite(visitorGeo.lon)) {
          return { lat: visitorGeo.lat, lon: visitorGeo.lon };
        }
        if (room.cityKey) return coordsForCityKey(room.cityKey);
        return null;
      }
      if (room.cityKey) return coordsForCityKey(room.cityKey);
      return null;
    }
    function weatherForRoom(room) {
      const c = coordsForRoom(room);
      if (!c) return null;
      return weatherByKey[coordKey(c.lat, c.lon)] || null;
    }
    function wxIconSvg(kind, isDay) {
      const stroke = 'currentColor';
      if (kind === 'clear' && isDay) {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      }
      if (kind === 'clear') {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M16 14a6 6 0 1 1-5.3-8.9A5 5 0 0 0 16 14z"/></svg>';
      }
      if (kind === 'cloudy') {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M7 17h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3.5 3.5 0 0 0 7 17z"/></svg>';
      }
      if (kind === 'fog') {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M4 9h16M5 13h14M7 17h10"/></svg>';
      }
      if (kind === 'drizzle' || kind === 'rain' || kind === 'thunder') {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.4 2A3.5 3.5 0 0 0 7 15z"/><path d="M8 19l1-2M12 20l1-2M16 19l1-2"/></svg>';
      }
      if (kind === 'snow') {
        return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M12 5v14M7.5 8.5l9 7M7.5 15.5l9-7"/></svg>';
      }
      return '<svg class="wx-icon" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" aria-hidden="true"><path d="M7 17h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3.5 3.5 0 0 0 7 17z"/></svg>';
    }
    function paintWxEl(el, wx) {
      if (!el) return;
      if (weatherQueryOff() || !wx) {
        el.hidden = true;
        el.classList.remove('is-on');
        el.innerHTML = '';
        return;
      }
      const kind = weatherKind(wx.code);
      const pack = (t().wx || I18N.en.wx || {});
      const label = pack[kind] || kind;
      let temp = '';
      if (typeof wx.tempC === 'number' && isFinite(wx.tempC)) {
        if (useFahrenheit()) temp = Math.round(wx.tempC * 9 / 5 + 32) + '°F';
        else temp = Math.round(wx.tempC) + '°C';
      }
      el.innerHTML = wxIconSvg(kind, !!wx.isDay) +
        (temp ? '<span class="wx-temp">' + temp + '</span>' : '');
      el.hidden = false;
      el.classList.add('is-on');
      el.setAttribute('title', [label, temp].filter(Boolean).join(' · '));
    }
    function paintAllWeather() {
      tiles.forEach(function (tile) {
        paintWxEl(tile.wx, weatherForRoom(tile.room));
      });
      const you = currentLayout && currentLayout[CENTER_SLOT];
      youWeather = you ? weatherForRoom(you) : null;
      if (focused) {
        const focusWx = document.getElementById('focusWx');
        if (focusWx) paintWxEl(focusWx, weatherForRoom(focused));
      }
      updateAmbienceForWeather();
    }

    function refreshWeather() {
      if (weatherQueryOff() || typeof fetch !== 'function') {
        paintAllWeather();
        return;
      }
      const jobs = [];
      const seen = {};
      const layout = currentLayout || [];
      for (let i = 0; i < layout.length; i++) {
        const c = coordsForRoom(layout[i]);
        if (!c) continue;
        const k = coordKey(c.lat, c.lon);
        if (seen[k]) continue;
        seen[k] = true;
        jobs.push({ key: k, lat: c.lat, lon: c.lon });
      }
      if (!jobs.length) {
        paintAllWeather();
        return;
      }
      const lats = jobs.map(function (j) { return j.lat; }).join(',');
      const lons = jobs.map(function (j) { return j.lon; }).join(',');
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(lats) +
        '&longitude=' + encodeURIComponent(lons) +
        '&current=weather_code,temperature_2m,is_day';
      fetchJsonTimeout(url, WX_TIMEOUT_MS).then(function (data) {
        const rows = Array.isArray(data) ? data : [data];
        rows.forEach(function (row, idx) {
          const cur = row && row.current;
          if (!cur) return;
          const job = jobs[idx];
          if (!job) return;
          weatherByKey[job.key] = {
            code: cur.weather_code,
            tempC: cur.temperature_2m,
            isDay: cur.is_day === 1 || cur.is_day === true,
            fetchedAt: Date.now()
          };
        });
        paintAllWeather();
      }).catch(function () {
        paintAllWeather();
      });
    }

    // --- Music (file, load only on play) + weather ambience (procedural Web Audio) ---
    const musicBtn = document.getElementById('musicBtn');
    const musicEl = document.getElementById('musicEl');
    const soundBtn = document.getElementById('soundBtn');
    let musicOn = false;
    let audioCtx = null;
    let ambienceMaster = null;
    let ambienceCurrent = null;
    let ambienceKey = '';
    let ambienceUnlocked = false;
    function readAmbienceMuted() {
      try {
        const v = localStorage.getItem(AMBIENCE_MUTE_KEY);
        return v === '1' || v === 'true';
      } catch (e) { return false; }
    }
    function writeAmbienceMuted(on) {
      try {
        if (on) localStorage.setItem(AMBIENCE_MUTE_KEY, '1');
        else localStorage.removeItem(AMBIENCE_MUTE_KEY);
      } catch (e) {}
    }
    let ambienceMuted = readAmbienceMuted();
    if (soundBtn) soundBtn.setAttribute('aria-pressed', ambienceMuted ? 'false' : 'true');

    function makeNoiseBuffer(ctx, seconds, kind) {
      const len = Math.max(1, Math.floor(ctx.sampleRate * seconds));
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        let b0 = 0, b1 = 0, b2 = 0, last = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          let s = w;
          if (kind === 'pink') {
            b0 = 0.99765 * b0 + w * 0.0990460;
            b1 = 0.96300 * b1 + w * 0.2965164;
            b2 = 0.57000 * b2 + w * 1.0526913;
            s = b0 + b1 + b2 + w * 0.1848;
          } else if (kind === 'brown') {
            last = (last + 0.02 * w) / 1.02;
            s = last * 3.5;
          }
          d[i] = Math.max(-1, Math.min(1, s));
        }
        const fade = Math.min(2048, Math.floor(len / 16));
        for (let i = 0; i < fade; i++) {
          const w = i / fade;
          const a = d[i];
          const b = d[len - fade + i];
          d[i] = b * (1 - w) + a * w;
          d[len - fade + i] = a * (1 - w) + b * w;
        }
      }
      return buf;
    }
    function loopNoise(ctx, dest, seconds, kind) {
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(ctx, seconds, kind);
      src.loop = true;
      src.connect(dest);
      src.start();
      return src;
    }
    function playThunder(ctx, dest) {
      const dur = 1.8 + Math.random() * 2.4;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.025 * w) / 1.025;
        const env = Math.exp(-i / (ctx.sampleRate * (0.4 + Math.random() * 0.2))) * (1 - i / len);
        const crack = (i < ctx.sampleRate * 0.06) ? (Math.random() * 2 - 1) * (1 - i / (ctx.sampleRate * 0.06)) * 0.4 : 0;
        d[i] = (last * 3.2 * env + crack) * 0.9;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 180 + Math.random() * 220;
      lp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.value = 0.55 + Math.random() * 0.25;
      src.connect(lp);
      lp.connect(g);
      g.connect(dest);
      src.start();
      src.onended = function () { try { src.disconnect(); lp.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function playBird(ctx, dest) {
      const now = ctx.currentTime;
      const notes = 2 + Math.floor(Math.random() * 3);
      let t = now;
      let freq = 2200 + Math.random() * 2200;
      for (let n = 0; n < notes; n++) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(600, freq * (0.85 + Math.random() * 0.35)), t + 0.09);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.045, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(g);
        g.connect(dest);
        osc.start(t);
        osc.stop(t + 0.12);
        t += 0.09 + Math.random() * 0.1;
        freq *= 0.92 + Math.random() * 0.2;
      }
    }
    function playCricket(ctx, dest) {
      const now = ctx.currentTime;
      const chirps = 4 + Math.floor(Math.random() * 5);
      let t = now;
      const base = 4200 + Math.random() * 1800;
      for (let i = 0; i < chirps; i++) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = base;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = base;
        bp.Q.value = 8;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.03, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
        osc.connect(bp);
        bp.connect(g);
        g.connect(dest);
        osc.start(t);
        osc.stop(t + 0.035);
        t += 0.032 + Math.random() * 0.015;
      }
    }
    function buildAmbienceGraph(ctx, kind, isDay) {
      const out = ctx.createGain();
      const nodes = [];
      const timers = [];
      function retain(n) { nodes.push(n); return n; }
      function stop() {
        timers.forEach(function (id) { clearTimeout(id); });
        timers.length = 0;
        nodes.forEach(function (n) {
          try { if (n.stop) n.stop(); } catch (e) {}
          try { n.disconnect(); } catch (e) {}
        });
      }
      const rainLike = kind === 'drizzle' || kind === 'rain' || kind === 'thunder';
      if (rainLike) {
        const filterGain = retain(ctx.createGain());
        const bp = retain(ctx.createBiquadFilter());
        bp.type = 'bandpass';
        const hp = retain(ctx.createBiquadFilter());
        hp.type = 'highpass';
        if (kind === 'drizzle') {
          bp.frequency.value = 2000; bp.Q.value = 0.5; hp.frequency.value = 800;
          filterGain.gain.value = 0.12;
        } else if (kind === 'thunder') {
          bp.frequency.value = 1200; bp.Q.value = 0.35; hp.frequency.value = 400;
          filterGain.gain.value = 0.24;
        } else {
          bp.frequency.value = 1600; bp.Q.value = 0.45; hp.frequency.value = 600;
          filterGain.gain.value = 0.18;
        }
        const src = retain(loopNoise(ctx, bp, 3.2, 'white'));
        bp.connect(hp);
        hp.connect(filterGain);
        filterGain.connect(out);
        if (kind === 'thunder') {
          const rumble = retain(ctx.createBiquadFilter());
          rumble.type = 'lowpass';
          rumble.frequency.value = 280;
          const rg = retain(ctx.createGain());
          rg.gain.value = 0.08;
          retain(loopNoise(ctx, rumble, 4, 'brown'));
          rumble.connect(rg);
          rg.connect(out);
          (function schedule() {
            const wait = 9000 + Math.random() * 18000;
            const id = setTimeout(function () {
              if (ctx.state === 'closed') return;
              playThunder(ctx, out);
              schedule();
            }, wait);
            timers.push(id);
          })();
        }
      } else if (kind === 'snow') {
        const hp = retain(ctx.createBiquadFilter());
        hp.type = 'highpass';
        hp.frequency.value = 900;
        const lp = retain(ctx.createBiquadFilter());
        lp.type = 'lowpass';
        lp.frequency.value = 2400;
        const g = retain(ctx.createGain());
        g.gain.value = 0.07;
        retain(loopNoise(ctx, hp, 4, 'pink'));
        hp.connect(lp);
        lp.connect(g);
        g.connect(out);
        const wind = retain(ctx.createBiquadFilter());
        wind.type = 'bandpass';
        wind.frequency.value = 500;
        wind.Q.value = 0.8;
        const wg = retain(ctx.createGain());
        wg.gain.value = 0.05;
        retain(loopNoise(ctx, wind, 5, 'pink'));
        wind.connect(wg);
        wg.connect(out);
        const lfo = retain(ctx.createOscillator());
        lfo.type = 'sine';
        lfo.frequency.value = 0.07;
        const lfoG = retain(ctx.createGain());
        lfoG.gain.value = 180;
        lfo.connect(lfoG);
        lfoG.connect(wind.frequency);
        lfo.start();
      } else if (kind === 'cloudy') {
        const bp = retain(ctx.createBiquadFilter());
        bp.type = 'bandpass';
        bp.frequency.value = 700;
        bp.Q.value = 0.7;
        const g = retain(ctx.createGain());
        g.gain.value = 0.1;
        retain(loopNoise(ctx, bp, 4.5, 'pink'));
        bp.connect(g);
        g.connect(out);
        const lfo = retain(ctx.createOscillator());
        lfo.type = 'sine';
        lfo.frequency.value = 0.11;
        const lfoF = retain(ctx.createGain());
        lfoF.gain.value = 280;
        lfo.connect(lfoF);
        lfoF.connect(bp.frequency);
        const lfo2 = retain(ctx.createOscillator());
        lfo2.type = 'sine';
        lfo2.frequency.value = 0.05;
        const lfoG = retain(ctx.createGain());
        lfoG.gain.value = 0.04;
        lfo2.connect(lfoG);
        lfoG.connect(g.gain);
        lfo.start();
        lfo2.start();
      } else if (kind === 'fog') {
        const lp = retain(ctx.createBiquadFilter());
        lp.type = 'lowpass';
        lp.frequency.value = 380;
        const g = retain(ctx.createGain());
        g.gain.value = 0.07;
        retain(loopNoise(ctx, lp, 5, 'brown'));
        lp.connect(g);
        g.connect(out);
        [92, 138].forEach(function (freq, i) {
          const osc = retain(ctx.createOscillator());
          osc.type = 'sine';
          osc.frequency.value = freq;
          const og = retain(ctx.createGain());
          og.gain.value = 0.02;
          const lfo = retain(ctx.createOscillator());
          lfo.type = 'sine';
          lfo.frequency.value = 0.04 + i * 0.02;
          const lg = retain(ctx.createGain());
          lg.gain.value = 0.01;
          lfo.connect(lg);
          lg.connect(og.gain);
          osc.connect(og);
          og.connect(out);
          osc.start();
          lfo.start();
        });
      } else {
        const hp = retain(ctx.createBiquadFilter());
        hp.type = 'highpass';
        hp.frequency.value = isDay ? 600 : 300;
        const g = retain(ctx.createGain());
        g.gain.value = isDay ? 0.035 : 0.025;
        retain(loopNoise(ctx, hp, 4, 'pink'));
        hp.connect(g);
        g.connect(out);
        if (isDay) {
          (function schedule() {
            const wait = 7000 + Math.random() * 14000;
            const id = setTimeout(function () {
              if (ctx.state === 'closed') return;
              playBird(ctx, out);
              schedule();
            }, wait);
            timers.push(id);
          })();
        } else {
          (function schedule() {
            const wait = 1600 + Math.random() * 1800;
            const id = setTimeout(function () {
              if (ctx.state === 'closed') return;
              playCricket(ctx, out);
              schedule();
            }, wait);
            timers.push(id);
          })();
        }
      }
      return { gain: out, stop: stop };
    }

    function ensureAudioCtx() {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      ambienceMaster = audioCtx.createGain();
      ambienceMaster.gain.value = 0;
      ambienceMaster.connect(audioCtx.destination);
      return audioCtx;
    }
    function ambienceMasterTarget() {
      if (ambienceMuted) return 0;
      return musicOn ? 0.5 : 1;
    }
    function applyAmbienceDuck() {
      if (!ambienceMaster || !audioCtx) return;
      const now = audioCtx.currentTime;
      ambienceMaster.gain.cancelScheduledValues(now);
      ambienceMaster.gain.setValueAtTime(ambienceMaster.gain.value, now);
      ambienceMaster.gain.linearRampToValueAtTime(ambienceMasterTarget(), now + 0.4);
    }
    function ambienceVariantKey() {
      const wx = youWeather;
      const kind = wx ? weatherKind(wx.code) : 'rain';
      const isDay = wx ? !!wx.isDay : true;
      return kind === 'clear' ? (isDay ? 'clear-day' : 'clear-night') : kind;
    }
    function startOrCrossfadeAmbience() {
      if (!ambienceUnlocked || ambienceMuted) {
        applyAmbienceDuck();
        return;
      }
      if (!ensureAudioCtx()) return;
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
      const key = ambienceVariantKey();
      if (ambienceCurrent && ambienceKey === key) {
        applyAmbienceDuck();
        return;
      }
      const wx = youWeather;
      const kind = wx ? weatherKind(wx.code) : 'rain';
      const isDay = wx ? !!wx.isDay : true;
      const next = buildAmbienceGraph(audioCtx, kind, isDay);
      next.gain.gain.value = 0;
      next.gain.connect(ambienceMaster);
      const now = audioCtx.currentTime;
      const fade = 1.8;
      if (ambienceCurrent) {
        const old = ambienceCurrent;
        old.gain.gain.cancelScheduledValues(now);
        old.gain.gain.setValueAtTime(old.gain.gain.value, now);
        old.gain.gain.linearRampToValueAtTime(0, now + fade);
        setTimeout(function () { try { old.stop(); old.gain.disconnect(); } catch (e) {} }, fade * 1000 + 80);
      }
      next.gain.gain.linearRampToValueAtTime(1, now + fade);
      ambienceCurrent = next;
      ambienceKey = key;
      applyAmbienceDuck();
    }
    function updateAmbienceForWeather() {
      if (ambienceUnlocked && !ambienceMuted) startOrCrossfadeAmbience();
    }
    function unlockAmbience() {
      if (ambienceUnlocked) return;
      ambienceUnlocked = true;
      startOrCrossfadeAmbience();
    }
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
      document.addEventListener(ev, unlockAmbience, { capture: true, passive: true });
    });

    function syncSoundLabels() {
      const s = t();
      if (soundBtn) {
        document.getElementById('soundLabel').textContent = (!ambienceMuted) ? s.ambienceOn : s.ambience;
        soundBtn.setAttribute('title', s.ambience);
        soundBtn.setAttribute('aria-pressed', ambienceMuted ? 'false' : 'true');
      }
      if (musicBtn) {
        document.getElementById('musicLabel').textContent = musicOn ? s.musicOn : s.musicSound;
        musicBtn.setAttribute('title', s.musicSound);
        musicBtn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
      }
    }

    if (soundBtn) {
      soundBtn.addEventListener('click', function () {
        ambienceMuted = !ambienceMuted;
        writeAmbienceMuted(ambienceMuted);
        if (!ambienceMuted) {
          ambienceUnlocked = true;
          startOrCrossfadeAmbience();
        } else {
          applyAmbienceDuck();
        }
        syncSoundLabels();
      });
    }

    function ensureMusicSrc() {
      if (!musicEl) return;
      if (!musicEl.getAttribute('src') && !musicEl.src) {
        musicEl.preload = 'none';
        musicEl.loop = true;
        musicEl.src = 'music.m4a';
      } else if (!musicEl.getAttribute('src') && musicEl.src && musicEl.src.indexOf('music.m4a') === -1) {
        musicEl.src = 'music.m4a';
      }
      if (!musicEl.getAttribute('src')) musicEl.setAttribute('src', 'music.m4a');
    }
    if (musicBtn && musicEl) {
      musicEl.preload = 'none';
      musicEl.loop = true;
      musicEl.volume = 0.5;
      musicBtn.addEventListener('click', function () {
        if (!musicOn) {
          ensureMusicSrc();
          const play = musicEl.play();
          if (play && play.catch) {
            play.then(function () {
              musicOn = true;
              applyAmbienceDuck();
              syncSoundLabels();
            }).catch(function () {
              musicOn = false;
              syncSoundLabels();
            });
          } else {
            musicOn = true;
            applyAmbienceDuck();
            syncSoundLabels();
          }
        } else {
          musicEl.pause();
          musicOn = false;
          applyAmbienceDuck();
          syncSoundLabels();
        }
      });
      musicEl.addEventListener('ended', function () {
        if (musicOn && musicEl.loop) return;
        musicOn = false;
        applyAmbienceDuck();
        syncSoundLabels();
      });
    }

    const menuBtn = document.getElementById('menuBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const englishToggle = document.getElementById('englishToggle');

    function openSettings() {
      closeThemeMenu();
      settingsPanel.hidden = false;
      settingsPanel.classList.add('open');
      menuBtn.setAttribute('aria-expanded', 'true');
      englishToggle.focus();
    }
    function closeSettings(restoreFocus) {
      if (settingsPanel.hidden) return;
      settingsPanel.classList.remove('open');
      settingsPanel.hidden = true;
      menuBtn.setAttribute('aria-expanded', 'false');
      if (restoreFocus) menuBtn.focus();
    }
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (settingsPanel.hidden) openSettings();
      else closeSettings(false);
    });

    function applyI18n() {
      const s = t();
      document.documentElement.lang = currentLang;
      document.title = s.title;
      const main = document.querySelector('.title-main');
      const sub = document.querySelector('.title-sub');
      if (main) main.textContent = s.title;
      if (sub) sub.textContent = s.subtitle;
      const names = themeNames(currentTheme);
      document.getElementById('themeLabel').textContent = names.main;
      const extra = document.querySelector('.theme-btn .label-extra');
      if (extra) extra.textContent = names.extra;
      themeMenu.setAttribute('aria-label', s.themes);
      document.getElementById('grid').setAttribute('aria-label', s.roomsLabel);
      document.getElementById('closeBtn').setAttribute('aria-label', s.close);
      document.getElementById('footerRights').textContent = s.footerRights;
      document.getElementById('settingsHeading').textContent = s.settings;
      document.getElementById('englishLabel').textContent = s.english;
      menuBtn.setAttribute('aria-label', s.settingsBtn);
      syncSoundLabels();
      tiles.forEach((tile) => {
        if (tile.room.visitor && tile.room.cityIsFallback) tile.room.city = s.yourCity;
        labelTile(tile);
      });
      paintAllWeather();
      renderThemeMenu();
      if (focused) updateFocus(virtualNow());
    }

    englishToggle.checked = readForceEnglish();
    englishToggle.addEventListener('change', () => {
      writeForceEnglish(englishToggle.checked);
      currentLang = resolveLang();
      applyI18n();
    });

    applyI18n();
    tick();
    setInterval(tick, 1000);

    function cityOverride() {
      try {
        const raw = new URLSearchParams(window.location.search).get('city');
        if (raw && raw.trim()) return raw.trim();
      } catch (e) {}
      return '';
    }
    function applyVisitorGeo(info, cityName) {
      if (info) {
        if (isFinite(info.lat) && isFinite(info.lon)) {
          visitorGeo = { lat: info.lat, lon: info.lon, city: info.city || cityName || '' };
        }
        if (info.country) visitorCountry = String(info.country).toUpperCase();
      }
      if ((!visitorGeo || !isFinite(visitorGeo.lat)) && cityName) {
        const c = coordsForCityKey(cityName);
        if (c) visitorGeo = { lat: c.lat, lon: c.lon, city: cityName };
      }
    }
    function startVisitorDetect() {
      const override = cityOverride();
      if (override) {
        const found = findByName(override);
        const key = found ? found.key : override;
        applyVisitorGeo(null, key);
        const next = layoutFromCityName(override);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { applyLayout(next, true); });
        });
        return;
      }
      lookupIpCity().then(function (info) {
        const city = typeof info === 'string' ? info : (info && info.city);
        applyVisitorGeo(info, city);
        applyLayout(layoutFromCityName(city), true);
      }).catch(function () {
        /* keep the zone-based layout already on screen; try coords from the zone city */
        const you = currentLayout && currentLayout[CENTER_SLOT];
        if (you && you.cityKey) applyVisitorGeo(null, you.cityKey);
        refreshWeather();
      });
    }
    startVisitorDetect();
    if (!weatherTimer) weatherTimer = setInterval(refreshWeather, WX_REFRESH_MS);
    refreshWeather();

    // Expose a tiny hook so future settings can swap room art without rewriting clocks/themes.
    window.NineLives = { SETTINGS, CURRENT_SETTING, THEMES, ROOMS, CITY_TABLE, CITY_NAMES, periodForHour, DEFAULT_LANG, resolveLang, YOU_NAME, weatherKind, formatLocale, visitorHourCycle, roomZone, activityBlockId, activityLineFor, hourOverride, virtualNow };
  })();
  </script>
