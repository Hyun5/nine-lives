<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimal-ui">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nine Lives">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Nine Lives</title>
  <meta name="description" content="Nine study rooms in nine cities, each with a live local clock.">
  <meta name="author" content="SuperAlex">
  <style>
    :root {
      --bg: #07060c;
      --bg-2: #0e0c16;
      --ink: #f3eefc;
      --muted: #9a92ad;
      --line: rgba(160, 140, 255, 0.22);
      --cyan: #5dffe9;
      --cyan-dim: #1ad4c0;
      --magenta: #ff4fd8;
      --amber: #ffc857;
      --rain: rgba(90, 160, 255, 0.55);
      --tile-radius: 14px;
      --header-h: 72px;
      --footer-h: 36px;
      --gap: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      min-height: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(80, 20, 90, 0.35), transparent 55%),
        radial-gradient(900px 500px at 100% 100%, rgba(0, 60, 70, 0.28), transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans", "Apple SD Gothic Neo", sans-serif;
      letter-spacing: 0.01em;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .chrome {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: var(--header-h);
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18, 14, 28, 0.92), rgba(10, 8, 16, 0.75));
      backdrop-filter: blur(10px);
      z-index: 5;
    }
    .brand { display: flex; align-items: center; min-width: 0; }
    .title-main {
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.15;
      background: linear-gradient(90deg, var(--cyan), #d8b6ff 45%, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 10px rgba(93, 255, 233, 0.25));
    }
    .controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .theme-wrap { position: relative; }
    .theme-btn, .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(20, 16, 32, 0.8);
      color: var(--ink);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .theme-btn:hover, .sound-btn:hover,
    .theme-btn[aria-expanded="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
    }
    .theme-btn .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .theme-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(280px, 70vw);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.96);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 79, 216, 0.08);
      z-index: 20;
    }
    .theme-menu.open { display: block; }
    .theme-item {
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border-radius: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .theme-item:hover:not(:disabled) { background: rgba(93, 255, 233, 0.08); }
    .theme-item[aria-current="true"] { background: rgba(93, 255, 233, 0.12); }
    .theme-item:disabled { opacity: 0.55; cursor: not-allowed; }
    .theme-item .ko { color: var(--muted); font-size: 0.78rem; }
    .theme-item .soon {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .sound-btn[aria-pressed="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
    }
    .sound-btn svg, .theme-btn .chev { flex: 0 0 auto; }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: var(--gap);
      display: flex;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gap);
      min-height: 0;
    }

    .tile {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: var(--tile-radius);
      border: 1px solid rgba(180, 160, 255, 0.18);
      background: #120e18;
      text-align: left;
      color: inherit;
      min-height: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .tile .vis, .tile video, .tile img.still {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .tile video { opacity: 0; transition: opacity 2.5s ease-in-out; }
    .tile video.on { opacity: 1; }
    .tile img.still { opacity: 1; transition: opacity 2.5s ease-in-out; }
    .tile.no-fade video,
    .tile.no-fade img.still { transition: none; }
    .tile .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(6, 4, 12, 0.15) 0%, transparent 28%, transparent 52%, rgba(6, 4, 12, 0.82) 100%),
        linear-gradient(90deg, rgba(10, 20, 50, 0.12), transparent 30%);
      pointer-events: none;
      z-index: 1;
    }
    .rain-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
      opacity: 0.9;
    }
    .rain-layer span {
      position: absolute;
      top: -20%;
      width: 1.2px;
      height: 14%;
      background: linear-gradient(180deg, transparent, var(--rain), transparent);
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {
      from { transform: translateY(0); }
      to { transform: translateY(900%); }
    }
    .wet-glass {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(200, 230, 255, 0.07), transparent 18%),
        radial-gradient(circle at 70% 20%, rgba(200, 230, 255, 0.06), transparent 14%),
        linear-gradient(180deg, rgba(140, 180, 255, 0.05), transparent 40%);
      mix-blend-mode: screen;
    }
    .meta {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: 12px 12px 11px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .meta-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }
    .who { min-width: 0; }
    .city {
      font-size: 0.66rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d8d2e8;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    }
    .who .name {
      display: block;
      margin-top: 1px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .neon {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
      font-size: clamp(0.82rem, 1.15vw, 1.08rem);
      letter-spacing: 0.06em;
      color: var(--cyan);
      text-shadow:
        0 0 4px rgba(93, 255, 233, 0.9),
        0 0 14px rgba(36, 230, 200, 0.7),
        0 0 28px rgba(36, 230, 200, 0.35);
      line-height: 1;
      white-space: nowrap;
    }
    .clock-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      min-width: 0;
    }
    .wx {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      color: #e8e4f0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.85), 0 1px 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      opacity: 1;
    }
    .wx.is-on { display: flex; }
    .wx[hidden] { display: none !important; }
    .wx-icon {
      width: 13px; height: 13px;
      flex: 0 0 auto;
      display: block;
      opacity: 1;
    }
    .wx-temp {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }
    .wx-label { display: none; }
    .weather-credit {
      opacity: 0.78;
      white-space: nowrap;
    }
    footer p { text-align: center; padding: 0 10px; }

    .neon .ampm {
      margin-left: 0.28em;
      font-size: 0.48em;
      letter-spacing: 0.14em;
      color: var(--magenta);
      text-shadow:
        0 0 4px rgba(255, 79, 216, 0.95),
        0 0 12px rgba(255, 79, 216, 0.55);
      vertical-align: 0.35em;
    }
    .tile[data-period="evening"] .neon { color: var(--amber); text-shadow: 0 0 4px rgba(255, 200, 87, 0.9), 0 0 16px rgba(255, 180, 60, 0.55); }
    .tile[data-period="evening"] .neon .ampm { color: #ff8a4c; text-shadow: 0 0 6px rgba(255, 120, 60, 0.8); }
    .tile[data-period="late"] .neon,
    .tile[data-period="night"] .neon { color: #8ad4ff; text-shadow: 0 0 4px rgba(100, 190, 255, 0.9), 0 0 16px rgba(40, 120, 255, 0.5); }

    footer {
      flex: 0 0 var(--footer-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      border-top: 1px solid var(--line);
    }
    footer a { color: #c8c0dc; }
    footer a:hover { color: var(--cyan); }
    footer p {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.3em 0.45em;
      text-align: center;
      padding: 0 10px;
      line-height: 1.3;
    }
    .yt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: -6px 0;
      border-radius: 8px;
      color: var(--cyan);
      filter: drop-shadow(0 0 6px rgba(93, 255, 233, 0.45));
      flex: 0 0 auto;
      vertical-align: middle;
    }
    .yt-btn svg { width: 18px; height: 18px; display: block; }
    .yt-btn:hover, .yt-btn:focus-visible {
      color: #fff;
      filter: drop-shadow(0 0 10px rgba(93, 255, 233, 0.75));
      outline: none;
    }
    .fs-hint {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(420px, calc(100vw - 24px));
      padding: 8px 10px 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.94);
      box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 0 16px rgba(93, 255, 233, 0.12);
      color: var(--ink);
      font-size: 0.82rem;
    }
    .fs-hint[hidden] { display: none !important; }
    .fs-hint p { margin: 0; flex: 1 1 auto; }
    .fs-hint-go {
      border: 1px solid rgba(93, 255, 233, 0.55);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--cyan);
      font-size: 0.78rem;
    }
    .fs-hint-dismiss {
      width: 32px; height: 32px;
      border-radius: 50%;
      color: var(--muted);
      font-size: 1.1rem;
    }
    @media (max-width: 720px) {
      #fsLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    }

    @media (max-width: 720px) {
      .theme-btn .label-extra { display: none !important; }
      #soundLabel, #musicLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .title-main { font-size: 1.05rem; }
      .wx { font-size: 0.68rem; }
      .wx-icon { width: 13px; height: 13px; }
    }

    @media (max-width: 720px) and (orientation: portrait) {
      :root { --header-h: 58px; --footer-h: 40px; --gap: 8px; }
      html, body { height: auto; }
      body { overflow: auto; }
      .chrome {
        position: sticky;
        top: 0;
        padding: 0 12px;
      }
      main { display: block; height: auto; flex: 0 0 auto; min-height: auto; }
      footer { position: relative; flex: 0 0 auto; }
      .grid {
        display: flex;
        flex-direction: column;
        height: auto;
        gap: 8px;
      }
      .tile {
        flex: 0 0 auto;
        height: 52vw;
        min-height: 200px;
        max-height: 280px;
      }
      .neon { font-size: 1.35rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      html {
        height: auto;
        min-height: calc(100svh + 2px);
        min-height: calc(100dvh + 2px);
      }
      html, body { height: auto; }
      body {
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }
      :root { --header-h: 42px; --footer-h: 22px; --gap: 5px; --tile-radius: 8px; }
      .chrome { padding: 0 10px; }
      .title-main { font-size: 0.95rem; letter-spacing: 0.06em; }
      .theme-btn, .sound-btn { padding: 4px 9px; font-size: 0.72rem; }
      .theme-btn .label-extra { display: none; }
      .meta { padding: 6px 8px 7px; }
      .city { font-size: 0.62rem; letter-spacing: 0.08em; }
      .who .name { display: none; }
      .neon { font-size: 0.8rem; }
      .wx { font-size: 0.68rem; }
      .wx-icon { width: 13px; height: 13px; }
      .wx-label { display: none; }
      footer { font-size: 0.62rem; }
    }


    /* Hamburger + settings (language row at the bottom; theme toggles can be added above it later) */
    .menu-btn {
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.94);
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .menu-btn:hover, .menu-btn:focus-visible, .menu-btn[aria-expanded="true"] {
      border-color: rgba(93, 255, 233, 0.55);
      box-shadow: 0 0 16px rgba(93, 255, 233, 0.18);
      outline: none;
      color: var(--cyan);
    }
    .settings-panel {
      display: none;
      position: fixed;
      left: 60px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 31;
      width: min(300px, calc(100vw - 76px));
      max-height: calc(100svh - 24px);
      max-height: calc(100dvh - 24px);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(12, 10, 20, 0.96);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 79, 216, 0.08);
    }
    @media (max-height: 500px) {
      .settings-panel {
        top: 12px;
        transform: none;
        max-height: calc(100svh - 24px);
        max-height: calc(100dvh - 24px);
      }
    }
    .settings-panel.open { display: block; }
    .settings-panel h2 {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 0 8px 10px;
    }
    .settings-slot { min-height: 0; }
    .theme-picker { margin: 0 0 6px; }
    .theme-picker-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 0 8px 6px;
    }
    .theme-pick {
      width: 100%;
      text-align: left;
      padding: 7px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .theme-pick-name {
      flex: 0 1 auto;
      min-width: 0;
    }
    .theme-pick:hover, .theme-pick:focus-visible {
      background: rgba(93, 255, 233, 0.08);
      outline: none;
    }
    .theme-pick[aria-checked="true"] { background: rgba(93, 255, 233, 0.12); }
    .theme-now {
      margin: 0 8px 10px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #d8d2e8;
    }
    .theme-pick.is-radio {
      align-items: center;
      gap: 8px;
    }
    .theme-radio {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(200, 196, 216, 0.7);
      box-sizing: border-box;
      display: inline-block;
      position: relative;
    }
    .theme-pick[aria-checked="true"] .theme-radio {
      border-color: var(--cyan);
    }
    .theme-pick[aria-checked="true"] .theme-radio::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--cyan);
    }
    .theme-pick.is-coming {
      opacity: 0.55;
      pointer-events: none;
      cursor: default;
      color: #b8b0c6;
    }
    .theme-pick.is-coming:hover, .theme-pick.is-coming:focus-visible {
      background: transparent;
    }
    .theme-week {
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .theme-pick-tags {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      flex: 0 0 auto;
    }
    .theme-pick .kind {
      font-size: 0.64rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .theme-pick .soon {
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .settings-temp,
    .settings-lang {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 8px;
      border-top: 1px solid var(--line);
    }
    .settings-temp span.label,
    .settings-lang span.label { font-size: 0.92rem; }
    .temp-toggle {
      display: inline-flex;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: #2a2436;
    }
    .temp-unit {
      min-width: 42px;
      padding: 4px 9px;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: #c8c0dc;
      background: transparent;
    }
    .temp-unit[aria-pressed="true"] {
      background: rgba(93, 255, 233, 0.22);
      color: var(--cyan);
    }
    .temp-unit:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--cyan);
    }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }
    .switch .track {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #2a2436;
      border: 1px solid var(--line);
      transition: background 0.2s, border-color 0.2s;
    }
    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d8d0e8;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .track {
      background: rgba(93, 255, 233, 0.22);
      border-color: rgba(93, 255, 233, 0.7);
    }
    .switch input:checked + .track::after {
      transform: translateX(18px);
      background: var(--cyan);
    }

    /* Moonlight Window: CSS overlays only. Day stays a clear sunny city

    html[data-visual-theme="moonlight"] .vis[data-tod="night"] .fx-moon {

        radial-gradient(ellipse 55% 70% at 88% 10%, rgba(210, 225, 255, 0.46), rgba(160, 190, 255, 0.14) 42%, transparent 72%),

      mix-blend-mode: screen;

    html[data-visual-theme="moonlight"] .vis[data-tod="night"] .fx-citylights {

    html[data-visual-theme="moonlight"] .page-sky[data-wx="clear"][data-tod="day"] .sky-wx,

    /* ---- Winter themes: Christmas, Snow, Fireplace, Winter Sunlight Window ----
       Art-agnostic overlays only (window, sky and light layers on top of the
       room art; nothing is baked into character images, so a different art set
       with the same room framing can be swapped in). Theme layers are built
       only for the active theme (see THEME_FX in the script). .fx-art mirrors
       the stills' object-fit: cover / object-position: center 40% so window
       rects (WINDOW_RECTS, image-space %) line up at any tile aspect. */
    .fx { container-type: size; }
    .fx-theme { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    /* Chrome does not sample the room art for backdrop-filter (window
       desaturation) through the z-indexed .fx stacking context, so under the
       winter overlay themes .fx drops its z-index and .fx-theme carries it. */
    .fx-art {
      position: absolute; left: 50%; top: 40%;
      width: 100%; height: 100%;
      transform: translate(-50%, -40%);
    }
    @supports (width: 1cqw) {
      .fx-art { width: max(100cqw, 177.778cqh); height: max(56.25cqw, 100cqh); }
    }
    .fx-art .win { position: absolute; overflow: hidden; }
    .fx-art .win.round { border-radius: 50%; }
    .fx-art .win > div { position: absolute; inset: 0; }
    .th-flakes span {
      position: absolute; top: 0; height: 100%;
      width: 6px; margin-left: -3px;
      background: radial-gradient(circle at 50% 3px, rgba(255,255,255,0.95) 0, rgba(255,255,255,0.95) var(--r, 1.3px), transparent calc(var(--r, 1.3px) + 1px)) no-repeat;
      animation: thflake linear infinite;
    }
    .wglass .th-flakes.heavy span { width: 12px; margin-left: -6px;
      background:
        radial-gradient(circle at 50% 3px, #fff 0, #fff var(--r, 1.6px), transparent calc(var(--r, 1.6px) + 1px)),
        radial-gradient(circle at 25% 36%, rgba(255,255,255,0.9) 0, rgba(255,255,255,0.9) calc(var(--r, 1.6px) * 0.8), transparent calc(var(--r, 1.6px) * 0.8 + 1px)),
        radial-gradient(circle at 75% 69%, rgba(255,255,255,0.92) 0, rgba(255,255,255,0.92) calc(var(--r, 1.6px) * 0.9), transparent calc(var(--r, 1.6px) * 0.9 + 1px));
      background-repeat: no-repeat; filter: drop-shadow(0 0 1px rgba(40, 50, 70, 0.6)); }
    @keyframes thflake {

      to { transform: translate3d(0, 100%, 0); }

    .vis[data-tod="night"] .th-frost { opacity: 0.55; }

    .vis[data-tod="night"] .th-streetglow, .vis[data-tod="evening"] .th-streetglow { opacity: 1; }
    html[data-visual-theme="snow"] .vis[data-tod="day"] .fx-tod {

    /* Fireplace: warm flickering firelight from a low corner, rising embers. */
    .th-fire, .th-fire2 {

        radial-gradient(ellipse 60% 75% at var(--fx, 10%) 104%, rgba(255, 140, 50, 0.55), rgba(255, 110, 40, 0.2) 45%, transparent 75%),

    .vis[data-tod="night"] .th-coolwin, .vis[data-tod="evening"] .th-coolwin { opacity: 1; }
    html[data-visual-theme="fireplace"] .vis[data-tod="day"] .fx-tod {

    .th-beam {
      position: absolute;

    function makeNoiseBuffer(ctx, seconds, kind) {
